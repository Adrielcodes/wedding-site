<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #ffffff; }
      .foreground { fill: #000000; }
      .divider { stroke: #000000; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #000000; }
      .foreground { fill: #ffffff; }
      .divider { stroke: #ffffff; }
    }
  </style>

  <rect class="background" width="180" height="180" rx="36" />

  <text
    class="foreground"
    x="50"
    y="112"
    text-anchor="middle"
    font-size="76"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
  >A</text>

  <line class="divider" x1="88" y1="54" x2="98" y2="126" stroke-width="6" stroke-linecap="round" />

  <text
    class="foreground"
    x="130"
    y="112"
    text-anchor="middle"
    font-size="76"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
  >Z</text>
</svg>